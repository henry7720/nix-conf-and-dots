[arch-dev]
image=quay.io/toolbx/arch-toolbox:latest
home=/home/henry/arch-dev
hostname=arch-dev

# 2. Automated package installation at creation
additional_packages=git base-devel jdk-openjdk github-cli clang llvm python uv gcc gdb make valgrind nodejs npm bash-completion pacman-contrib reflector micro neovim rust wl-clipboard

# 3. Post-install hook: installs yay-bin and vscodium-bin cleanly without root makepkg errors or single-quote eval syntax collisions
init_hooks=su - henry -c "mkdir -p ~/.config && ln -sfn ../../.config/git ~/.config/git  && ln -sfn ../.ssh ~/.ssh && ln -sfn ../.gemini ~/.gemini && ln -sfn ../.vscode-oss ~/.vscode-oss && ln -sfn ../.vscode-oss-shared ~/.vscode-oss-shared && ln -sfn ../../.config/VSCodium ~/.config/VSCodium && (command -v yay >/dev/null || (git clone --depth=1 https://aur.archlinux.org/yay-bin.git /tmp/yay-bin && cd /tmp/yay-bin && makepkg -si --noconfirm && cd ~ && rm -rf /tmp/yay-bin)) && (command -v codium >/dev/null || yay -Syu --needed --noconfirm vscodium-bin) && (command -v agy >/dev/null || curl -fsSL https://antigravity.google/cli/install.sh | bash) && rm -f ~/.bashrc && ln -sfn ../.config/arch-dev/.bashrc ~/.bashrc"

# 4. Declarative host exports
exported_bins=/usr/bin/node /usr/bin/gcc /usr/bin/gdb /usr/bin/make /usr/bin/valgrind /usr/bin/uv /usr/bin/uvx /usr/bin/python /usr/bin/python3 /usr/bin/java /usr/bin/javac /usr/bin/rustc /usr/bin/cargo /usr/bin/clang /usr/bin/yay /home/henry/arch-dev/.local/bin/agy
exported_apps=codium
